<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Fragmento head: recibe el título de la pestaña como parámetro -->
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Ticket Logger</title>
  <!-- Bootstrap: aporta las clases container, btn, table, alert... que usan las vistas -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Hueco para la barra de navegación fija (fixed-top) del header -->
  <style>body { padding-top: 4.5rem; }</style>
</head>
</html>
